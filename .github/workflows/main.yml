name: Aegis Client Build

"on":
  push:
    branches:
      - main
      - master
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aegis-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Minecraft 26.1.2 client mod
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          test -f src/client/java/com/aegis/client/AegisClient.java
          echo 'Project files found.'
          java --version
          gradle --version

      - name: Build Aegis
        shell: bash
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify JAR
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          jar_file="build/libs/aegis-client-2.0.0.jar"

          if [[ ! -s "$jar_file" ]]; then
            echo "ERROR: Expected JAR was not produced: $jar_file" >&2
            echo 'Contents of build/libs:'
            find build/libs -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi

          jar tf "$jar_file" | grep -Fx 'fabric.mod.json'
          jar tf "$jar_file" | grep -Fx 'com/aegis/client/AegisClient.class'

          echo "jar_path=$jar_file" >> "$GITHUB_OUTPUT"
          ls -lh "$jar_file"

      - name: Upload Aegis JAR
        uses: actions/upload-artifact@v7
        with:
          name: AegisClient-Minecraft-26.1.2
          path: ${{ steps.verify.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30
